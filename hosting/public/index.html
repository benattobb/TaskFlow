<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="TaskFlow is a private, local-first Android task capture app with optional Google Tasks and Calendar sync.">
  <title>TaskFlow</title>
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #1d2723; background: #fbfcfa; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(circle at 12% 5%, #e6f5e4 0, transparent 30rem), #fbfcfa; }
    main { box-sizing: border-box; width: min(42rem, 100%); padding: 3rem 1.5rem; }
    .mark { display: inline-grid; place-items: center; width: 3.25rem; height: 3.25rem; border-radius: 1rem; background: #b9f291; color: #111a15; font-size: 2rem; font-weight: 800; }
    h1 { margin: 1.25rem 0 .5rem; font-size: clamp(2.4rem, 8vw, 4.5rem); letter-spacing: -.07em; }
    p { max-width: 38rem; line-height: 1.6; color: #526057; }
    .links { display: flex; flex-wrap: wrap; gap: .75rem; margin-top: 2rem; }
    a { color: #173621; font-weight: 700; }
    .button { text-decoration: none; background: #1d2723; color: white; padding: .8rem 1rem; border-radius: .8rem; }
    footer { margin-top: 3rem; font-size: .9rem; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">✓</div>
    <h1>TaskFlow</h1>
    <p>Capture a task naturally, keep the language processing on your phone, and optionally sync it to your own Google Tasks and Google Calendar.</p>
    <div class="links">
      <a class="button" href="https://github.com/benattobb/TaskFlow/releases">Download for Android</a>
      <a href="https://github.com/benattobb/TaskFlow">Open source code</a>
    </div>
    <footer>
      <a href="/privacy">Privacy policy</a> · <a href="/terms">Terms of service</a>
    </footer>
  </main>
</body>
</html>
